[package]
name = "acoustic-engine"
version = "0.2.0"
edition = "2024"

authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
license = "GPL-2.0-or-later"
description = "Solveur acoustique 2D (FDTD, grille décalée) en f32 : bords absorbants, sources, récepteurs, rayon optionnel"
repository = "https://github.com/jorgeandrecastro/acoustic_engine"
documentation = "https://docs.rs/acoustic-engine"
readme = "README.md"
keywords = ["acoustics", "fdtd", "simulation", "wave", "physics"]
categories = ["science", "simulation", "mathematics"]

[features]
default = []
# Parallélise les boucles du solveur sur les lignes de la grille.
rayon = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }

[dev-dependencies]
# Uniquement pour examples/viewer.rs
minifb = "0.27"

[package.metadata.docs.rs]
all-features = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
